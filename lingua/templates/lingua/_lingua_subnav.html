{# Shared pill sub-nav across the parent Spanish/Lingua pages (LGA-75). Pass `active` as one of: progress, library or books. Keep this comment to one physical line with no comment markers inside, or it leaks to the page (LGA-83). #}
<ul class="nav nav-pills gap-1 mb-3 no-print">
  <li class="nav-item">
    <a class="nav-link{% if active == 'progress' %} active{% endif %}"
       {% if active == 'progress' %}aria-current="page"{% endif %}
       href="{% url 'lingua:progress' %}">Progress</a>
  </li>
  <li class="nav-item">
    <a class="nav-link{% if active == 'library' %} active{% endif %}"
       {% if active == 'library' %}aria-current="page"{% endif %}
       href="{% url 'lingua:library_list' %}">Library list</a>
  </li>
  <li class="nav-item">
    <a class="nav-link{% if active == 'books' %} active{% endif %}"
       {% if active == 'books' %}aria-current="page"{% endif %}
       href="{% url 'lingua:book_log' %}">Reading log</a>
  </li>
</ul>
